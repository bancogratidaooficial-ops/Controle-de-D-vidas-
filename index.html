<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App - Controle de Dívidas</title><link rel="manifest" href="manifest.json">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.gold{color:#ffcc00}
.card{background:#111;border:1px solid #332a00;border-radius:16px;padding:14px;margin:10px auto;max-width:440px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #ffcc00;background:#000;color:#fff;margin:5px 0}
.btn{background:#ffcc00;color:#000;border:none;padding:13px;width:100%;border-radius:12px;font-weight:900;margin:6px 0;cursor:pointer}
.btn2{background:transparent;border:2px solid #ffcc00;color:#ffcc00}
.item{display:flex;justify-content:space-between;background:#0d0d0d;padding:10px;border-radius:12px;margin:7px 0;border-left:4px solid #ffcc00}
.item.ok{border-left-color:#00ff88;opacity:.6}
.resumo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.resumo div{background:#000;border:1px solid #ffcc00;border-radius:12px;padding:8px}
.resumo b{color:#ffcc00;font-size:12px;display:block}
#bloqueio{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}
</style></head><body>
<div class="card">
<h2 class="gold">💰 CONTROLE DE DÍVIDAS</h2>
<p id="statusTrial" style="font-size:12px;margin:4px 0"></p>

<div class="resumo">
<div><b>A RECEBER</b><span id="aReceber">R$ 0,00</span></div>
<div><b>RECEBIDO</b><span id="recebido" style="color:#00ff88">R$ 0,00</span></div>
<div><b>TOTAL GERAL</b><span id="totalGeral">R$ 0,00</span></div>
</div>

<input id="nome" placeholder="Nome de quem deve">
<input id="valor" type="number" placeholder="Valor R$">
<input id="data" type="date">
<button class="btn" onclick="add()">+ ADICIONAR DÍVIDA</button>

<div id="lista"></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button class="btn btn2" onclick="backup()">💾 BACKUP</button>
<button class="btn btn2" onclick="document.getElementById('file').click()">♻️ RESTAURAR</button>
<input type="file" id="file" style="display:none" onchange="restaurar(this)">
</div>

<button class="btn btn2" onclick="verLixeira()">🗑️ LIXEIRA (<span id="qtdLixeira">0</span>)</button>
<div id="lixeiraLista" style="display:none"></div>

<button class="btn btn2" onclick="compartilhar()">🔗 COMPARTILHAR APP</button>
<p style="font-size:11px;margin-top:10px;opacity:.6">PIX: 025.446.319-37 • R$ 2,99/semana</p>
</div>

<div id="bloqueio"><div class="card" style="border:2px solid #ffcc00">
<h2 class="gold">🔒 TESTE ACABOU</h2>
<p>PIX R$ 2,99 e use o código GRATI-XXXX</p>
<input id="cod" placeholder="GRATI-XXXX">
<button class="btn" onclick="liberar()">DESBLOQUEAR</button>
<p id="msgErro" style="color:#ff4444;font-size:12px"></p>
</div></div>

<script>
let dividas = JSON.parse(localStorage.getItem('dividas')||'[]');
let lixeira = JSON.parse(localStorage.getItem('lixeira')||'[]');
let inicio = localStorage.getItem('inicio') || Date.now();
if(!localStorage.getItem('inicio')) localStorage.setItem('inicio',inicio);

function check(){
 let lib = localStorage.getItem('liberadoAte')||0;
 let dias = Math.floor((Date.now()-inicio)/86400000);
 if(Date.now()>lib && dias>=3){document.getElementById('bloqueio').style.display='flex'; return true;}
 document.getElementById('statusTrial').innerText = Date.now()<lib? '✅ LIBERADO até '+new Date(parseInt(lib)).toLocaleDateString() : `⏳ Teste: dia ${dias+1} de 3 - grátis`;
 return false;
}
function add(){
 if(check()) return;
 let n=nome.value.trim(), v=parseFloat(valor.value), d=data.value;
 if(!n||!v) return alert('Preencha');
 dividas.push({n,v,d,ok:false,id:Date.now()});
 salvar();
}
function salvar(){ localStorage.setItem('dividas',JSON.stringify(dividas)); localStorage.setItem('lixeira',JSON.stringify(lixeira)); render(); }
function render(){
 let html='', aRec=0, rec=0;
 dividas.forEach((o,i)=>{
  if(o.ok) rec+=o.v; else aRec+=o.v;
  html+=`<div class="item ${o.ok?'ok':''}"><div><b>${o.n}</b><br><small>R$ ${o.v.toFixed(2)} - ${o.d||''} ${o.ok?'✅ RECEBIDO':''}</small></div><div style="text-align:right"><input type="checkbox" ${o.ok?'checked':''} onchange="toggle(${i})" title="Recebido"><br><button onclick="moverLixeira(${i})" style="background:#ff0000;color:#fff;border:none;border-radius:6px;padding:4px 9px;margin-top:4px">🗑️</button></div></div>`;
 });
 lista.innerHTML=html||'<p style=opacity:.5;text-align:center>Sem dívidas</p>';
 aReceber.innerText='R$ '+aRec.toFixed(2); recebido.innerText='R$ '+rec.toFixed(2); totalGeral.innerText='R$ '+(aRec+rec).toFixed(2);
 qtdLixeira.innerText=lixeira.length;
 // lixeira render
 let hl=''; lixeira.forEach((o,i)=>{ hl+=`<div class=item style=border-left-color:red><div><b>${o.n}</b><br><small>R$ ${o.v}</small></div><div><button onclick="restaurarLixeira(${i})" style="background:#00aa00;color:#fff;border:none;border-radius:6px;padding:4px 8px">↩️</button><button onclick="apagarDef(${i})" style="background:#000;border:1px solid red;color:red;border-radius:6px;padding:4px 8px;margin-left:4px">X</button></div></div>` });
 lixeiraLista.innerHTML=hl;
}
function toggle(i){ dividas[i].ok=!dividas[i].ok; salvar(); }
function moverLixeira(i){ lixeira.push(dividas[i]); dividas.splice(i,1); salvar(); }
function verLixeira(){ let el=document.getElementById('lixeiraLista'); el.style.display=el.style.display=='none'?'block':'none'; }
function restaurarLixeira(i){ dividas.push(lixeira[i]); lixeira.splice(i,1); salvar(); }
function apagarDef(i){ if(confirm('Apagar definitivo?')){ lixeira.splice(i,1); salvar(); } }
function backup(){
 let dados = JSON.stringify({dividas, lixeira, data:new Date()});
 let blob = new Blob([dados],{type:'application/json'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup-dividas-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function restaurar(input){
 let file=input.files[0]; if(!file) return;
 let r=new FileReader(); r.onload=e=>{
  try{ let j=JSON.parse(e.target.result); dividas=j.dividas||j; lixeira=j.lixeira||[]; salvar(); alert('Restaurado!'); }catch{ alert('Arquivo inválido'); }
 }; r.readAsText(file);
}
function liberar(){
 let c=cod.value.trim().toUpperCase();
 if(!c.startsWith('GRATI-')){msgErro.innerText='Código inválido'; return;}
 localStorage.setItem('liberadoAte', Date.now()+7*86400000); localStorage.setItem('ultimoCod',c);
 bloqueio.style.display='none'; check();
}
function compartilhar(){ let u=location.href.replace('app.html',''); if(navigator.share){navigator.share({title:'Controle Dívidas',url:u})} else {navigator.clipboard.writeText(u); alert('Link copiado: '+u)} }
render(); check();
</script>
</body></html>
