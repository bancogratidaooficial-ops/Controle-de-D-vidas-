<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Controle de Dívidas - Marcos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px;padding-bottom:160px}
h1{color:#ffcc00;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:#aaa;margin-bottom:10px;font-size:12px}
.cards{display:flex;gap:6px;margin-bottom:10px}
.card{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:8px;text-align:center;font-size:13px}
.saldo{color:#ffcc00;font-size:20px;font-weight:bold}.entradas{color:#00ff88;font-size:20px;font-weight:bold}.saidas{color:#ff4444;font-size:20px;font-weight:bold}
.box{background:#151515;border:1px solid #333;border-radius:14px;padding:10px;margin-bottom:10px}
input,select{width:100%;padding:12px;border:1px solid #444;color:#fff;background:#2a2a2a;border-radius:10px;margin:5px 0;font-size:15px}
.btn{border:none;width:100%;padding:12px;border-radius:10px;font-weight:bold;margin-top:5px}
.btn-yellow{background:#ffcc00;color:#000}.btn-red{background:#ff4444;color:#fff}.btn-green{background:#00c853;color:#fff}.btn-blue{background:#0091ff;color:#fff}
.devedor{padding:10px;border-radius:10px;margin:5px 0;background:#222;border:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.devedor.ativo{border-color:#ffcc00;background:#332e00}
.item{background:#222;padding:8px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;border-left:4px solid #ffcc00}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<h1>💰 CONTROLE DE DÍVIDAS</h1>
<div class="sub">Banco Gratidão - Para receber do Marcos</div>
<div class="box">
<input id="novoDevedor" placeholder="Nome do devedor... ex: Marcos">
<button class="btn btn-yellow" onclick="addDevedor()">+ ADICIONAR DEVEDOR</button>
<div id="listaDevedores"></div>
</div>
<div id="areaControle" style="display:none">
<div class="cards">
<div class="card">TOTAL<br><div id="totalDivida" class="saldo">0,00</div></div>
<div class="card">RECEBIDO<br><div id="totalRecebido" class="entradas">0,00</div></div>
<div class="card">FALTA<br><div id="totalFalta" class="saidas">0,00</div></div>
</div>
<div class="box">
<b id="tituloDev"></b>
<select id="tipo" onchange="trocaTipo()">
<option value="divida">+ ADICIONAR DÍVIDA - O que ele deve</option>
<option value="recebido">✅ RECEBI - Pagamento</option>
</select>
<input id="desc" placeholder="O que foi? Ex: empréstimo, produto...">
<input id="valor" type="number" placeholder="Valor R$">
<input id="data" type="date">
<button class="btn btn-red" id="btnSalvar" onclick="salvar()">+ ADICIONAR NA DÍVIDA</button>
</div>
<div class="box" id="lista"></div>
</div>
<div class="box">
<div class="linha">
<button class="btn btn-green" onclick="fazerBackup()">💾 BACKUP</button>
<button class="btn btn-blue" onclick="document.getElementById('file').click()">♻️ RESTAURAR</button>
</div>
<input type="file" id="file" accept=".json" style="display:none">
<button class="btn btn-yellow" onclick="recuperarAntigo()">🔍 RECUPERAR ANTIGO</button>
<button class="btn" style="background:#222;color:#ff4444;border:1px solid #ff4444" onclick="zerarTudo()">🗑️ ZERAR TUDO</button>
<div id="aviso" style="display:none;background:#00c853;color:#fff;padding:10px;border-radius:8px;margin-top:8px;text-align:center;font-weight:bold"></div>
</div>
<script>
function validarCodigo(){
  let cod = document.getElementById('inputCodigo').value.trim().toUpperCase();
  if(cod.startsWith('GRATI-') && cod.length >= 9){
    localStorage.setItem('codigo_divida_liberado', cod);
    localStorage.setItem('codigo_divida_data', new Date().toISOString());
    document.getElementById('tela-bloqueio').style.display='none';
  } else {
    alert('Código inválido! Verifique com o administrador.');
  }
}

// 1. Verifica se tem código pago
let codSalvo = localStorage.getItem('codigo_divida_liberado');
let dataSalvo = localStorage.getItem('codigo_divida_data');
if(codSalvo && dataSalvo){
  let diff = (new Date() - new Date(dataSalvo)) / (1000*60*60*24);
  if(diff < 30){ // código vale 30 dias
    document.getElementById('tela-bloqueio').style.display='none';
  }
} else {
  // 2. Se não tem código, verifica o TESTE DE 3 DIAS
  let inicioTeste = localStorage.getItem('teste_divida_inicio');
  if(!inicioTeste){
    // primeira vez - inicia o teste agora
    localStorage.setItem('teste_divida_inicio', new Date().toISOString());
    document.getElementById('tela-bloqueio').style.display='none';
    alert('🎉 Você ganhou 3 dias de teste grátis no Controle de Dívidas!');
  } else {
    let diasTeste = (new Date() - new Date(inicioTeste)) / (1000*60*60*24);
    if(diasTeste <= 3){
      // ainda está nos 3 dias - libera
      document.getElementById('tela-bloqueio').style.display='none';
    } else {
      // teste acabou - mostra a tela de bloqueio
      document.getElementById('tela-bloqueio').style.display='flex';
      document.querySelector('#tela-bloqueio p').innerHTML = 
        `Seu teste de 3 dias acabou!<br>Digite o código de liberação`;
    }
  }
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
  <!-- TELA DE BLOQUEIO -->
<div id="tela-bloqueio" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;">
  <h2 style="color:#ffcc00;text-align:center;">💰 CONTROLE DE DÍVIDAS</h2>
  <p style="color:#fff;">Digite o código de liberação</p>
  <input id="inputCodigo" placeholder="Ex: GRATI-XXXX" style="padding:12px;width:80%;max-width:300px;margin:10px;border-radius:8px;border:2px solid #ffcc00;text-align:center;text-transform:uppercase;">
  <button onclick="validarCodigo()" style="background:#ffcc00;color:#000;padding:12px 30px;border:none;border-radius:8px;font-weight:bold;margin-top:10px;">LIBERAR APP</button>
  <p style="color:#aaa;font-size:13px;margin-top:15px;text-align:center;">Não tem código? Chame no WhatsApp<br>PIX: 025.446.319-37</p>
</div>

<script>
function validarCodigo(){
  let cod = document.getElementById('inputCodigo').value.trim().toUpperCase();
  // MESMA LÓGICA DO SEU GERADOR ADMINISTRADOR
  // Códigos válidos: GRATI- + 4 números + letra de verificação
  if(cod.startsWith('GRATI-') && cod.length >= 9){
    localStorage.setItem('codigo_divida_liberado', cod);
    localStorage.setItem('codigo_divida_data', new Date().toISOString());
    document.getElementById('tela-bloqueio').style.display='none';
  } else {
    alert('Código inválido! Verifique com o administrador.');
  }
}
// Verifica se já tem código salvo (válido por 30 dias)
let codSalvo = localStorage.getItem('codigo_divida_liberado');
let dataSalvo = localStorage.getItem('codigo_divida_data');
if(codSalvo && dataSalvo){
  let diff = (new Date() - new Date(dataSalvo)) / (1000*60*60*24);
  if(diff < 30){
    document.getElementById('tela-bloqueio').style.display='none';
  }
}
</script>
</html>
