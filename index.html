<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Dividas</title>
<link rel="manifest" href="manifest.json">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:10px;margin:10px 0}
input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;background:#222;color:#fff;border:1px solid #ffcc00;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:12px;font-weight:bold;border:none;margin:5px 0}
.amarelo{background:#ffcc00;color:#000}
.verde{background:#00c853;color:#fff}
.azul{background:#2196f3;color:#fff}
.verm{background:#ff4444;color:#fff}
.devedor{padding:10px;background:#222;margin:5px 0;border-radius:10px;border:1px solid #444}
.ativo{border-color:#ffcc00;background:#332e00}
.item{padding:10px;background:#222;margin:5px 0;border-left:4px solid #ffcc00;border-radius:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<h2 style="color:#ffcc00;text-align:center">💰 CONTROLE DE DÍVIDAS</h2>
<div class="box">
<input id="novoDev" placeholder="Nome: Marcos">
<button class="amarelo" onclick="addDev()">+ ADICIONAR DEVEDOR</button>
<div id="listaDevs"></div>
</div>
<div id="area" style="display:none">
<div class="box">
<b id="tit"></b><br>
<select id="tipo"><option value="divida">💸 DÍVIDA</option><option value="recebido">✅ RECEBI</option></select>
<input id="desc" placeholder="O que? Ex: Serviços gerais">
<input id="valor" type="number" placeholder="Valor 1570">
<input id="data" type="date">
<button class="verm" onclick="addDiv()">+ ADICIONAR NA DÍVIDA</button>
<div id="lista"></div>
<div id="totais" style="margin-top:10px;color:#ffcc00;font-weight:bold"></div>
</div>
<div class="box">
<button class="verde" onclick="backup()">💾 BACKUP</button>
<button class="azul" onclick="restaura()">♻️ RESTAURAR</button>
<button class="amarelo" onclick="compartilha()">🔗 COMPARTILHAR</button>
<button class="verde" onclick="zap()">📲 CONVIDAR ZAP</button>
<p style="font-size:11px">PIX: 025.446.319-37 R$2,99/sem</p>
</div>
</div>
<script>
var chave='DIVIDAS_OK_FINAL';
var db = JSON.parse(localStorage.getItem(chave) || '{"devs":[]}');
var sel = db.devs.length?db.devs[0].nome:null;

function salvar(){
localStorage.setItem(chave, JSON.stringify(db));
mostrarDevs();
mostrarLista();
}

function addDev(){
var el=document.getElementById('novoDev');
var nome=el.value.trim();
if(!nome){alert('Digite o nome');return;}
for(var i=0;i<db.devs.length;i++){if(db.devs[i].nome.toLowerCase()==nome.toLowerCase()){sel=db.devs[i].nome;el.value='';salvar();return;}}
db.devs.push({nome:nome, divs:[]});
sel=nome;
el.value='';
salvar();
}

function selDev(n){sel=n;salvar();}

function addDiv(){
if(!sel){alert('Clique no devedor primeiro');return;}
var d=document.getElementById('desc').value.trim()||'Serviço';
var v=parseFloat(document.getElementById('valor').value);
var dt=document.getElementById('data').value||new Date().toISOString().slice(0,10);
var t=document.getElementById('tipo').value;
if(!v){alert('Digite valor');return;}
var dev=null;
for(var i=0;i<db.devs.length;i++){if(db.devs[i].nome==sel)dev=db.devs[i];}
dev.divs.push({id:Date.now(),desc:d,valor:v,data:dt,tipo:t});
document.getElementById('desc').value='';
document.getElementById('valor').value='';
salvar();
}

function mostrarDevs(){
var div=document.getElementById('listaDevs');
div.innerHTML='';
for(var i=0;i<db.devs.length;i++){
var d=db.devs[i];
var tot=0, rec=0;
for(var j=0;j<d.divs.length;j++){if(d.divs[j].tipo=='recebido')rec+=d.divs[j].valor;else tot+=d.divs[j].valor;}
var el=document.createElement('div');
el.className='devedor'+(d.nome==sel?' ativo':'');
el.innerText=d.nome+' - Falta R$ '+(tot-rec).toFixed(2);
el.onclick=(function(n){return function(){selDev(n);};})(d.nome);
div.appendChild(el);
}
}

function mostrarLista(){
var area=document.getElementById('area');
if(!sel||db.devs.length==0){area.style.display='none';return;}
area.style.display='block';
var dev=null;
for(var i=0;i<db.devs.length;i++){if(db.devs[i].nome==sel)dev=db.devs[i];}
if(!dev){sel=db.devs[0].nome;dev=db.devs[0];}
document.getElementById('tit').innerText='📒 '+dev.nome;
var lista=document.getElementById('lista');
lista.innerHTML='';
var tot=0,rec=0;
for(var j=0;j<dev.divs.length;j++){if(dev.divs[j].tipo=='recebido')rec+=dev.divs[j].valor;else tot+=dev.divs[j].valor;}
for(var k=dev.divs.length-1;k>=0;k--){
var l=dev.divs[k];
var it=document.createElement('div');
it.className='item';
it.innerHTML='<span><b>'+l.desc+'</b><br><small>'+l.data+' R$ '+l.valor+'</small></span><span onclick="apagar('+l.id+')" style="color:red">X</span>';
lista.appendChild(it);
}
document.getElementById('totais').innerText='TOTAL R$ '+tot.toFixed(2)+' | RECEBIDO R$ '+rec.toFixed(2)+' | FALTA R$ '+(tot-rec).toFixed(2);
}

function apagar(id){
var dev=null;
for(var i=0;i<db.devs.length;i++){if(db.devs[i].nome==sel)dev=db.devs[i];}
var novo=[];
for(var j=0;j<dev.divs.length;j++){if(dev.divs[j].id!=id)novo.push(dev.divs[j]);}
dev.divs=novo;
salvar();
}

function backup(){
var b=new Blob([JSON.stringify(db)],{type:'application/json'});
var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup.json';a.click();
}

function restaura(){
var inp=document.createElement('input');inp.type='file';inp.accept='.json';
inp.onchange=function(e){
var f=e.target.files[0];var r=new FileReader();
r.onload=function(ev){try{db=JSON.parse(ev.target.result);if(db.devs.length)sel=db.devs[0].nome;salvar();alert('Restaurado');}catch(e){alert('Erro');}};
r.readAsText(f);
};
inp.click();
}

function compartilha(){
var t='App Controle de Dividas https://bancogratidaooficial-ops.github.io/controle-de-dividas/';
if(navigator.share)navigator.share({text:t});else{navigator.clipboard.writeText(t);alert('Copiado');}
}

function zap(){
var m=encodeURIComponent('App Controle de Dividas https://bancogratidaooficial-ops.github.io/controle-de-dividas/ PIX 025.446.319-37');
window.open('https://wa.me/?text='+m,'_blank');
}

mostrarDevs();
mostrarLista();
document.getElementById('data').valueAsDate=new Date();
</script>
</body>
</html>
