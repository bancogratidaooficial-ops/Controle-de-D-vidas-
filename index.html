<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Dívidas</title><link rel="manifest" href="manifest.json">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;display:flex;justify-content:center}
.card{background:#0e0e0e;border:2px solid #ffcc00;border-radius:22px;padding:14px;width:100%;max-width:420px}
.top{display:flex;justify-content:space-between;gap:8px;margin:10px 0}
.box{border:2px solid #ffcc00;border-radius:14px;padding:8px;flex:1;text-align:center;font-size:12px}
.box b{color:#ffcc00;display:block}
.valor{font-size:16px}
.verde{color:#00ff88}
input{width:100%;padding:14px;border-radius:14px;border:2px solid #ffcc00;background:#000;color:#fff;margin:6px 0;box-sizing:border-box}
.btn{background:#ffcc00;color:#000;border:none;padding:14px;width:100%;border-radius:14px;font-weight:900;margin:6px 0}
.item{background:#1a1a1a;border-left:5px solid #ffcc00;border-radius:14px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.item.recebido{border-left-color:#00ff88;opacity:.7}
.item.recebido.nome{text-decoration:line-through}
.lix{cursor:pointer;background:#ff0000;border:none;border-radius:8px;padding:6px 10px}
.check{width:22px;height:22px}
.row2{display:flex;gap:8px}
.row2 button{flex:1;border:2px solid #ffcc00;background:#000;color:#ffcc00;border-radius:14px;padding:12px;font-weight:900}
</style>
</head><body>
<div class="card">
<h2 style="color:#ffcc00;text-align:center">💰 CONTROLE DE DÍVIDAS</h2>
<p id="testeInfo" style="font-size:12px">⏳ Teste: dia 1 de 3 - grátis</p>

<div class="top">
<div class="box"><b>A RECEBER</b><span class="valor" id="aReceber">R$ 0.00</span></div>
<div class="box"><b>RECEBIDO</b><span class="valor verde" id="recebido">R$ 0.00</span></div>
<div class="box"><b>TOTAL GERAL</b><span class="valor" id="total">R$ 0.00</span></div>
</div>

<input id="nome" placeholder="Nome ex: Marcos">
<input id="valor" type="number" placeholder="Valor ex: 1570">
<input id="data" type="date">
<button class="btn" onclick="add()">+ ADICIONAR DÍVIDA</button>

<div id="lista"></div>

<div class="row2"><button onclick="backup()">💾 BACKUP</button><button onclick="restaurar()">♻️ RESTAURAR</button></div>
<button class="row2" style="width:100%;margin-top:8px;border:2px solid #ffcc00;background:#000;color:#ffcc00;border-radius:14px;padding:12px;font-weight:900" onclick="verLixeira()">🗑️ LIXEIRA (<span id="qtdLixeira">0</span>)</button>
<button style="width:100%;margin-top:8px;border:2px solid #ffcc00;background:#000;color:#ffcc00;border-radius:14px;padding:12px;font-weight:900" onclick="share()">🔗 COMPARTILHAR APP</button>
<p style="font-size:11px;opacity:.5;margin-top:10px">PIX: 025.446.319-37 • R$ 2,99/semana</p>
</div>

<script>
let dividas = JSON.parse(localStorage.getItem('dividas')||'[]');
let lixeira = JSON.parse(localStorage.getItem('lixeiraDividas')||'[]');

function save(){localStorage.setItem('dividas',JSON.stringify(dividas));localStorage.setItem('lixeiraDividas',JSON.stringify(lixeira)); render();}

function add(){
 let n=document.getElementById('nome').value.trim();
 let v=parseFloat(document.getElementById('valor').value);
 let d=document.getElementById('data').value;
 if(!n||!v) return alert('Preencha nome e valor');
 dividas.push({id:Date.now(), nome:n, valor:v, data:d||new Date().toISOString().slice(0,10), recebido:false});
 document.getElementById('nome').value=''; document.getElementById('valor').value=''; save();
}

function toggle(id){
 let it=dividas.find(x=>x.id==id);
 if(it){ it.recebido=!it.recebido; save(); }
}

function del(id){
 if(!confirm('Mover para lixeira?')) return;
 let idx=dividas.findIndex(x=>x.id==id);
 if(idx>-1){ lixeira.push(dividas[idx]); dividas.splice(idx,1); save(); }
}

function render(){
 let html=''; let aReceber=0, recebido=0;
 dividas.forEach(it=>{
  if(it.recebido) recebido+=it.valor; else aReceber+=it.valor;
  html+=`<div class="item ${it.recebido?'recebido':''}">
  <div><b class="nome">${it.nome}</b><br><small>R$ ${it.valor.toFixed(2)} - ${it.data} ${it.recebido?' • ✅ RECEBIDO':''}</small></div>
  <div style="display:flex;align-items:center;gap:8px">
  <input type="checkbox" class="check" ${it.recebido?'checked':''} onchange="toggle(${it.id})">
  <button class="lix" onclick="del(${it.id})">🗑️</button>
  </div></div>`;
 });
 document.getElementById('lista').innerHTML=html||'<p style="opacity:.5;text-align:center">Nenhuma dívida</p>';
 document.getElementById('aReceber').innerText='R$ '+aReceber.toFixed(2);
 document.getElementById('recebido').innerText='R$ '+recebido.toFixed(2);
 document.getElementById('total').innerText='R$ '+(aReceber+recebido).toFixed(2);
 document.getElementById('qtdLixeira').innerText=lixeira.length;
}

function backup(){
 let data=btoa(JSON.stringify(dividas));
 prompt('Copie seu backup:',data);
}
function restaurar(){
 let data=prompt('Cole seu backup:');
 if(!data) return; try{ dividas=JSON.parse(atob(data)); save(); alert('Restaurado!'); }catch(e){ alert('Backup inválido'); }
}
function verLixeira(){
 if(!lixeira.length) return alert('Lixeira vazia');
 let t=lixeira.map((x,i)=>`${i+1}. ${x.nome} - R$ ${x.valor}`).join('\n');
 if(confirm(t+'\n\nRestaurar tudo?')){ dividas=dividas.concat(lixeira); lixeira=[]; save(); }
}
function share(){ if(navigator.share) navigator.share({title:'Controle de Dívidas',url:location.href}); else { navigator.clipboard.writeText(location.href); alert('Link copiado!'); } }

render();
</script>
</body></html>
